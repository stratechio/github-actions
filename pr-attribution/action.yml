name: pr-attribution
description: >-
  Fail a pull request whose title, body, or own commit messages (base..head)
  match any caller-supplied extended regular expression. On a merge-queue
  candidate (merge_group), scan every commit the candidate would land plus the
  title and body of the pull request the candidate belongs to. Policy-free: the
  patterns are inputs; nothing the caller did not name is scanned.
author: Stratech GmbH

inputs:
  patterns:
    description: >-
      JSON array of {"label": "...", "pattern": "..."} objects. Each pattern is
      a POSIX extended regular expression matched case-insensitively (grep -niE)
      against the pull-request title, the body, and the messages of the pull
      request's own commits (on merge_group: every commit the candidate would
      land). Required, no default: an empty, malformed, or
      unparsable list fails the run. Escape backslashes as JSON requires
      ("\\." for a literal dot).
    required: true
  remediation-hint:
    description: >-
      Text appended to the failure message, for example a pointer to the
      caller's conventions document. Empty means no hint.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check out the calling repository with full history
      # A composite action runs inside the caller's job: this checks out the
      # CALLER's repository at the pull request's merge ref, or at the merge
      # group's candidate commit. Full history so base..head resolves and every
      # branch, the merge group's base included, is present under origin/; no
      # credentials persist because nothing pushes.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Check the pull request title, body, and commits against the patterns
      # Untrusted event fields and the policy pass via env, never
      # interpolated into the shell, so a crafted title, body, ref, or pattern
      # cannot inject commands. The range is this pull request's own commits,
      # or every commit a merge-queue candidate would add to its base branch,
      # so a match already merged into the base cannot fail an unrelated PR.
      # github.token reads the queued pull request's title and body; the caller
      # job grants pull-requests: read for merge_group runs. Other events get
      # no token in this step.
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
        REPOSITORY: ${{ github.repository }}
        GH_TOKEN: ${{ github.event_name == 'merge_group' && github.token || '' }}
        PATTERNS: ${{ inputs.patterns }}
        REMEDIATION_HINT: ${{ inputs.remediation-hint }}
      run: |
        set -euo pipefail
        export LC_ALL=C

        for tool in git jq grep; do
          command -v "$tool" >/dev/null 2>&1 \
            || { echo "FAIL: pr-attribution: '$tool' is required on the runner." >&2; exit 1; }
        done

        # Policy comes only from the caller. The runner does not enforce a
        # composite action's required inputs, so the shell does: an empty or
        # malformed list would be a guard that never fails.
        if ! count="$(printf '%s' "${PATTERNS:-}" | jq -e '
              if type == "array" and length > 0
                 and all(.[]; type == "object" and keys == ["label", "pattern"]
                         and (.label | type) == "string" and (.label | length) > 0
                         and ((.label | test("\n")) | not)
                         and (.pattern | type) == "string" and (.pattern | length) > 0
                         and ((.pattern | test("\n")) | not))
              then length else error("invalid patterns") end' 2>/dev/null)"; then
          echo "FAIL: pr-attribution: 'patterns' must be a non-empty JSON array of {\"label\", \"pattern\"} objects with non-empty single-line strings." >&2
          exit 1
        fi

        # Resolve this pull request's own commit range into its messages. Fail
        # closed: an unresolvable revision aborts the guard rather than yielding
        # an empty, and therefore silently clean, buffer to scan.
        range_messages() {
          git rev-parse --verify --quiet "$1^{commit}" >/dev/null \
            || { echo "pr-attribution: cannot resolve base revision: $1" >&2; return 1; }
          git rev-parse --verify --quiet "$2^{commit}" >/dev/null \
            || { echo "pr-attribution: cannot resolve head revision: $2" >&2; return 1; }
          git log --format=%B "$1".."$2"
        }

        # Regression, kept in the shipped guard so it runs on every call: this
        # scan once ran without -e, so a 128 from git log left the buffer empty
        # and the guard passed an unscanned range. Prove the resolver still
        # fails closed before trusting it below.
        if range_messages 0000000000000000000000000000000000000000 "$HEAD_SHA" >/dev/null 2>&1; then
          echo "FAIL: self-test: an unresolvable base revision did not fail the scan." >&2
          exit 1
        fi
        echo "pr-attribution: self-test OK (an unresolvable range fails closed)"

        if [ "${EVENT_NAME:-}" = merge_group ]; then
          # A merge-queue candidate carries no pull-request fields. Its ref
          # names the pull request it was built for:
          # refs/heads/gh-readonly-queue/<base branch>/pr-<number>-<parent sha>.
          # Everything below fails closed: an unparsable ref, a base mismatch,
          # an unreadable or closed pull request, or an unresolvable range.
          mg_fail() {
            echo "FAIL: pr-attribution: $1; refusing to pass this merge group unscanned." >&2
            exit 1
          }
          command -v gh >/dev/null 2>&1 \
            || mg_fail "'gh' is required on the runner for merge_group events"
          [ -n "${GH_TOKEN:-}" ] || mg_fail "no token to read the queued pull request"
          [[ "${REPOSITORY:-}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
            || mg_fail "invalid repository '${REPOSITORY:-}'"
          [[ "${MG_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]] \
            || mg_fail "invalid merge group head SHA '${MG_HEAD_SHA:-}'"
          [[ "${MG_BASE_REF:-}" =~ ^refs/heads/(.+)$ ]] \
            || mg_fail "invalid merge group base ref '${MG_BASE_REF:-}'"
          base_branch="${BASH_REMATCH[1]}"
          [[ "${MG_HEAD_REF:-}" =~ ^refs/heads/gh-readonly-queue/(.+)/pr-([1-9][0-9]*)-[0-9a-f]{40}$ ]] \
            || mg_fail "unrecognised merge group head ref '${MG_HEAD_REF:-}'"
          [ "${BASH_REMATCH[1]}" = "$base_branch" ] \
            || mg_fail "merge group head ref '$MG_HEAD_REF' does not target base '$base_branch'"
          number="${BASH_REMATCH[2]}"

          pr="$(gh api "repos/$REPOSITORY/pulls/$number")" \
            || mg_fail "cannot read pull request #$number"
          printf '%s' "$pr" | jq -e --argjson n "$number" --arg base "$base_branch" '
              .number == $n and .state == "open" and .base.ref == $base
              and (.title | type) == "string"
              and ((.body | type) == "string" or .body == null)' >/dev/null 2>&1 \
            || mg_fail "pull request #$number is not an open pull request into '$base_branch'"
          PR_TITLE="$(printf '%s' "$pr" | jq -r '.title')"
          PR_BODY="$(printf '%s' "$pr" | jq -r '.body // ""')"

          # Every commit the candidate would add to the base branch: this
          # pull request's and those of any entry queued ahead of it.
          if ! commits="$(range_messages "refs/remotes/origin/$base_branch" "$MG_HEAD_SHA")"; then
            mg_fail "cannot scan the commit range origin/$base_branch..$MG_HEAD_SHA"
          fi
          echo "pr-attribution: merge group for pull request #$number (origin/$base_branch..$MG_HEAD_SHA)"
        elif ! commits="$(range_messages "$BASE_SHA" "$HEAD_SHA")"; then
          echo "FAIL: cannot scan this pull request's commit range; refusing to pass it unscanned." >&2
          exit 1
        fi
        text="${PR_TITLE:-}"$'\n'"${PR_BODY:-}"$'\n'"$commits"

        fail=0
        i=0
        while [ "$i" -lt "$count" ]; do
          label="$(printf '%s' "$PATTERNS" | jq -r --argjson i "$i" '.[$i].label')"
          pattern="$(printf '%s' "$PATTERNS" | jq -r --argjson i "$i" '.[$i].pattern')"
          # -n: line numbers within the scanned buffer; -e: a pattern may begin
          # with '-'. grep exits 2 on a malformed expression: that is a broken
          # policy, not a clean scan, so it fails the run.
          hits="$(printf '%s' "$text" | grep -niE -e "$pattern")" && rc=0 || rc=$?
          case "$rc" in
            0)
              fail=1
              echo "ERROR: forbidden pattern: $label"
              printf '%s\n' "$hits" | sed 's/^/       matched: /' ;;
            1) ;;
            *)
              echo "FAIL: pr-attribution: the pattern for '$label' is not a valid extended regular expression (grep exit $rc)." >&2
              exit 1 ;;
          esac
          i=$((i + 1))
        done
        if [ "$fail" -ne 0 ]; then
          echo ""
          echo "FAIL: the pull request title, body, or commit messages match a forbidden pattern."
          if [ -n "${REMEDIATION_HINT:-}" ]; then
            printf '%s\n' "$REMEDIATION_HINT" | sed 's/^/      /'
          fi
          exit 1
        fi
        echo "pr-attribution: OK (no forbidden patterns matched)"
